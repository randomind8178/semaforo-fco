name: aggiorna i dati

on:
  # Lo scheduler e' DISATTIVATO di proposito. adr.it risponde HTTP 403 alle richieste
  # che partono dai runner di GitHub: gli IP stanno nei range Azure, e il WAF davanti al
  # sito li rifiuta. Da una connessione domestica lo stesso codice funziona, e anche da
  # altri datacenter: non e' il sito che ha chiuso, e' quel percorso di rete a essere
  # bloccato. Lasciando il cron attivo il job fallirebbe 96 volte al giorno, riempiendo
  # la casella di notifiche e nascondendo i guasti veri fra il rumore.
  # Resta workflow_dispatch, che serve a verificare test e generazione a comando.
  # Da riattivare solo se un giorno il 403 sparisce, oppure sostituire con un runner
  # self-hosted, che gira sulla rete di casa e usa lo stesso identico workflow.
  #
  # schedule:
  #   - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Rome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run genera
      - name: committa se qualcosa è cambiato
        # In pratica il controllo non scatta mai, perché generatoAlle cambia a ogni
        # esecuzione: quindi si committa sempre. È voluto, non una dimenticanza. La
        # pagina mostra l'età del dato leggendo generatoAlle, e se saltassimo i commit
        # "senza variazioni" il telefono direbbe "aggiornato 45 minuti fa" mentre il
        # cron sta girando regolarmente. Il controllo resta come rete se un giorno il
        # formato del file cambiasse.
        run: |
          git config user.name  'semaforo-fco'
          git config user.email 'actions@users.noreply.github.com'
          if git diff --quiet data.json; then
            echo 'nessuna variazione'
            exit 0
          fi
          git add data.json
          git commit -m "dati: aggiornamento automatico"
          git push
